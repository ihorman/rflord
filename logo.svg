<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="antenna" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>

  <!-- Glow effect -->
  <circle cx="200" cy="180" r="150" fill="url(#glow)"/>

  <!-- Grid lines (spectrum analyzer style) -->
  <g stroke="#1f1f3a" stroke-width="0.5" opacity="0.5">
    <line x1="50" y1="80" x2="350" y2="80"/>
    <line x1="50" y1="120" x2="350" y2="120"/>
    <line x1="50" y1="160" x2="350" y2="160"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="50" y1="240" x2="350" y2="240"/>
    <line x1="80" y1="60" x2="80" y2="260"/>
    <line x1="140" y1="60" x2="140" y2="260"/>
    <line x1="200" y1="60" x2="200" y2="260"/>
    <line x1="260" y1="60" x2="260" y2="260"/>
    <line x1="320" y1="60" x2="320" y2="260"/>
  </g>

  <!-- RF Signal waves (spectrum) -->
  <path d="M 50,200 Q 80,120 110,200 Q 140,280 170,200 Q 200,100 230,200 Q 260,300 290,200 Q 320,80 350,200"
        fill="none" stroke="url(#wave)" stroke-width="3" opacity="0.9"/>
  <path d="M 50,200 Q 80,140 110,200 Q 140,260 170,200 Q 200,120 230,200 Q 260,280 290,200 Q 320,100 350,200"
        fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>

  <!-- Signal peaks (bars) -->
  <g fill="#e94560" opacity="0.7">
    <rect x="85" y="140" width="4" height="60" rx="2"/>
    <rect x="145" y="160" width="4" height="40" rx="2"/>
    <rect x="205" y="100" width="4" height="100" rx="2"/>
    <rect x="265" y="180" width="4" height="20" rx="2"/>
    <rect x="305" y="120" width="4" height="80" rx="2"/>
  </g>

  <!-- Antenna -->
  <line x1="200" y1="280" x2="200" y2="320" stroke="url(#antenna)" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="320" x2="220" y2="320" stroke="#666" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="275" r="6" fill="#e94560" opacity="0.8"/>
  <circle cx="200" cy="275" r="10" fill="none" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="275" r="15" fill="none" stroke="#e94560" stroke-width="0.5" opacity="0.2"/>

  <!-- Title -->
  <text x="200" y="355" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="bold" fill="#e94560">RFLord</text>
  <text x="200" y="378" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#888" letter-spacing="3">RF SPECTRUM MONITOR</text>
</svg>
